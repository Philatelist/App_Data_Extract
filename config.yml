# CLM Data Extract Configuration

server:
  url: https://..../services/rest/methods
  username:
  password:

# Path to the endpoints definition file
endpointsFile: inputs/endpoints.yml

# BO types to export. If empty or omitted, all BO types are discovered automatically.
boTypes:
  - name:

# Optional: filter discovered BOs by usage type. Allowed: Directory, NonContract, Contract.
# Only applies when boTypes is empty (discovery mode).
# boUsageTypeFilter: Contract

generateSummaryCsv: true
# optional, default: Summary_{DDMMYYYY}_{HHMMSS}.csv
summaryFilenameTemplate: "TotalPerBO_{DDMMYYYY}_{HHMMSS}.csv"

trackingFilter: ""

skipColumns:
  - "Component Id"

# CSV generation mode: per-component, merged-single, or single-only
csvMode: per-component

# CSV field delimiter
delimiter: ";"

# Filename template for export CSVs. Placeholders: {BO}, {Component}, {DDMMYYYY}, {HHMMSS}
filenameTemplate: "{BO}_{Component}_{DDMMYYYY}_{HHMMSS}.csv"

# Filename template for download list CSVs
downloadsFilenameTemplate: "{BO}_AttachmentsToDownload_{DDMMYYYY}_{HHMMSS}.csv"

generateParentCsv: true

# optional override:
parentFilenameTemplate: "{BO}_RelationshipMapping_{DDMMYYYY}_{HHMMSS}.csv"

# Base directory for all output
outputRoot: output

# Subdirectory name for export CSVs
exportFolderName: MetaData

# Number of tracking IDs per bundles API call
batchSize: 30

# Number of days to keep backup directories
backupRetentionDays: 30

# Set to true to run without a live server (uses sample JSON files)
offlineMode: false

# Retry settings for API calls
retry:
  maxAttempts: 3
  baseDelayMs: 1000

# single report or multiple
#reports: "Supplemental Report"
