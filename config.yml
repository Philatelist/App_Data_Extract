server: {url: 'https://pepsico-clone.auto-dev.selectica.com/services/rest/methods',
  username: '', password: null}
endpointsFile: inputs/endpoints.yml
batchSize: 30
outputRoot: output
exportFolderName: MetaData
backupRetentionDays: 30
offlineMode: false
csvMode: per-component
delimiter: ;
filenameTemplate: '{BO}_{Component}_{DDMMYYYY}_{HHMMSS}.csv'
downloadsFilenameTemplate: '{BO}_AttachmentsToDownload_{DDMMYYYY}_{HHMMSS}.csv'
generateParentCsv: false
parentFilenameTemplate: '{BO}_BundleParent_{DDMMYYYY}_{HHMMSS}.csv'
generateSummaryCsv: false
summaryFilenameTemplate: Summary_{DDMMYYYY}_{HHMMSS}.csv
boUsageTypeFilter: Contract
trackingFilter: ''
boTypes: []
skipColumns: []
skipComponents: []
retry: {maxAttempts: 3, baseDelayMs: 1000}
delimiterReplacement: {enabled: false, substituteChar: ''}
additionalColumns: []
yesNoTranslationEnabled: false
yesNoTrueValue: 'YES'
yesNoFalseValue: 'NO'
dateFormat:
  inputFormats: []
  outputFormat: ''
  inputDateTimeFormats: []
  outputDateTimeFormat: ''
sftp: {host: '', port: 22, username: '', password: ''}
enableZipPackaging: false
enableSftpUpload: false
convertAttachmentsToPdf: true
includeEmptyExportFiles: false
adminEmails: [ausov@corcentric.com]
